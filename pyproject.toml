[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valscanner"
version = "0.1.4"
description = "Recursive file scanner with metadata, tagging, and duplicate detection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abdalrahman Valabji", email = "valabji@gmail.com" }]
requires-python = ">=3.8"
keywords = ["scanner", "files", "metadata", "duplicates", "sqlite", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6",
    "qtawesome>=1.3",
    "sqlalchemy>=2.0",
    "platformdirs>=4.0",
    "keyring>=24.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
rich = [
    "Pillow",
    "mutagen",
    "PyPDF2",
]

[project.scripts]
valscanner     = "valscanner.cli:main"
valscanner-gui = "valscanner.gui.window:main"
valscanner-web = "valscanner.web.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["valscanner*"]

[tool.setuptools.package-data]
valscanner = ["alembic.ini", "migrations/*", "migrations/versions/*", "assets/*"]
"valscanner.web" = ["static/**/*"]
