[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valscanner"
version = "0.2.5"
description = "A recursive file scanner with rich metadata extraction, full-text search, auto-tagging, thumbnail generation, and similar-folder detection — available as a CLI, a PySide6 desktop GUI, and a browser-based Web UI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abdalrahman Valabji", email = "valabji@gmail.com" }]
requires-python = ">=3.8"
keywords = ["scanner", "files", "metadata", "tagging", "thumbnails", "full-text-search", "similar-folders", "sqlite", "postgresql", "pyside6", "gui", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6",
    "qtawesome>=1.3",
    "sqlalchemy>=2.0",
    "platformdirs>=4.0",
    "keyring>=24.0",
    "alembic>=1.13",
    "psutil>=5.9",
    "sentry-sdk>=2.0",
]

[project.urls]
Homepage = "https://github.com/valabji/val-scanner"
Repository = "https://github.com/valabji/val-scanner"
"Bug Tracker" = "https://github.com/valabji/val-scanner/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
dev-gui = [
    "pytest-qt>=4.4",
]
rich = [
    "Pillow",
    "pillow-heif>=0.13",
    # pillow-avif-plugin 1.5.x ships no cp38 Windows wheel yet leaves requires_python
    # unset, so pip tries to build it from source on Windows/3.8 and fails (no libavif).
    # AVIF support is optional (guarded in core/metadata.py), so skip that one combo.
    "pillow-avif-plugin>=1.4; platform_system != 'Windows' or python_version >= '3.9'",
    "mutagen",
    "pypdf",
    "svglib>=1.5",
    "rlPyCairo>=0.2",
]

[project.scripts]
valscanner     = "valscanner.cli:main"
valscanner-gui = "valscanner.gui.window:main"
valscanner-web = "valscanner.web.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["valscanner*"]

[tool.setuptools.package-data]
valscanner = ["alembic.ini", "migrations/*", "migrations/versions/*", "assets/*", "assets/fonts/*.ttf"]
"valscanner.web" = ["static/**/*"]

[tool.pytest.ini_options]
addopts = "--cov=valscanner.core --cov=valscanner.web --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
